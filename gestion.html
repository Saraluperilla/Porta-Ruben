<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de trabajos — Rubén Afanador</title>
  <!-- Mismo styles.css que index.html: reusa las variables de color y
       agrega las reglas de sidebar/tabla/formulario al final -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="gestion">

  <aside class="sidebar">
    <h2 class="sidebar-titulo">Trabajos</h2>
    <nav class="sidebar-nav">
      <!-- data-seccion apunta al id de la sección que gestion.js muestra
           al hacer click (ver mostrarSeccion() en gestion.js) -->
      <button class="sidebar-item activo" data-seccion="mostrar-todos">Mostrar todos</button>
      <button class="sidebar-item" data-seccion="crear">Crear</button>
      <button class="sidebar-item" data-seccion="consultar">Consultar</button>
      <button class="sidebar-item" data-seccion="actualizar">Actualizar</button>
      <button class="sidebar-item" data-seccion="eliminar">Eliminar</button>
    </nav>
  </aside>

  <main class="contenido">

    <!-- Se ve por defecto (coincide con el botón "activo" de arriba) -->
    <section id="seccion-mostrar-todos" class="seccion">
      <h1>Todos los trabajos</h1>
      <!-- gestion.js la llena con una fila por cada trabajo -->
      <table id="tabla-trabajos" class="tabla">
        <thead>
          <tr>
            <th>ID</th>
            <th>Miniatura</th>
            <th>Título</th>
            <th>Categoría</th>
          </tr>
        </thead>
        <tbody id="tabla-trabajos-body"></tbody>
      </table>
    </section>

    <section id="seccion-crear" class="seccion" hidden>
      <h1>Agregar trabajo</h1>
      <!-- La imagen va como ruta/URL (ej. "images/trabajo-7.png"), no
           como archivo subido: un sitio estático no tiene dónde guardar
           un archivo nuevo sin un backend -->
      <form id="form-crear" class="form-crear">
        <label for="crear-titulo">Título</label>
        <input type="text" id="crear-titulo" name="titulo" required>

        <label for="crear-imagen">Imagen (ruta o URL)</label>
        <input type="text" id="crear-imagen" name="imagen" placeholder="images/trabajo-7.png" required>

        <label for="crear-categoria">Categoría</label>
        <input type="text" id="crear-categoria" name="categoria" required>

        <label for="crear-descripcion">Descripción</label>
        <textarea id="crear-descripcion" name="descripcion" rows="3" required></textarea>

        <button type="submit">Agregar trabajo</button>
      </form>
    </section>

    <section id="seccion-consultar" class="seccion" hidden>
      <h1>Consultar trabajo</h1>
      <!-- Los <select class="select-trabajo"> los llena gestion.js con
           una opción "id - título" por trabajo -->
      <div class="form-crear">
        <label for="consultar-id">Trabajo</label>
        <select id="consultar-id" class="select-trabajo"></select>
      </div>
      <article id="ficha-trabajo" class="ficha" hidden></article>
    </section>

    <section id="seccion-actualizar" class="seccion" hidden>
      <h1>Actualizar trabajo</h1>
      <div class="form-crear">
        <label for="actualizar-id">Trabajo</label>
        <select id="actualizar-id" class="select-trabajo"></select>
      </div>
      <!-- Mismos campos (y mismos "name") que form-crear, así gestion.js
           usa la misma función leerTrabajoDelFormulario() para ambos -->
      <form id="form-actualizar" class="form-crear" hidden>
        <label for="actualizar-titulo">Título</label>
        <input type="text" id="actualizar-titulo" name="titulo" required>

        <label for="actualizar-imagen">Imagen (ruta o URL)</label>
        <input type="text" id="actualizar-imagen" name="imagen" required>

        <label for="actualizar-categoria">Categoría</label>
        <input type="text" id="actualizar-categoria" name="categoria" required>

        <label for="actualizar-descripcion">Descripción</label>
        <textarea id="actualizar-descripcion" name="descripcion" rows="3" required></textarea>

        <button type="submit">Guardar cambios</button>
      </form>
    </section>

    <section id="seccion-eliminar" class="seccion" hidden>
      <h1>Eliminar trabajo</h1>
      <div class="form-crear">
        <label for="eliminar-id">Trabajo</label>
        <select id="eliminar-id" class="select-trabajo"></select>

        <div id="eliminar-confirmacion" hidden>
          <p id="eliminar-mensaje"></p>
          <div class="form-botones">
            <button type="button" id="btn-eliminar">Sí, eliminar</button>
            <button type="button" id="btn-cancelar-eliminar">Cancelar</button>
          </div>
        </div>
      </div>
    </section>

  </main>

</body>
<!-- data.js primero: gestion.js necesita leerTrabajos()/guardarTrabajos() -->
<script src="data.js"></script>
<script src="gestion.js"></script>
</html>
